name: build

on:
  push:
    # `tags` is mandatory: without it the workflow does not run on a tag push,
    # and the `release` job, which depends on `refs/tags/v*`, never fires —
    # leaving the repository with no asset and therefore not installable by
    # HACS.
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release:
    # `dist/` is in .gitignore, so the file does not exist in the repository
    # tree. HACS resolves hacs.json's `filename` from a release asset first and
    # only then from the tree: without this job neither route has the file and
    # the repository is not installable.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The release body comes from the CHANGELOG rather than from generated
      # notes: whoever installs by HACS reads this on the release page, and a
      # list of commits does not tell them what changed in the card. Without
      # `body` the action publishes the asset and an empty body — which is what
      # happened on 0.4.0, 0.4.1 and 0.4.2.
      - name: Extract the version's notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          # Failing here beats publishing an empty body again.
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/leapmotor-mate-card.js
          body_path: release-notes.md
